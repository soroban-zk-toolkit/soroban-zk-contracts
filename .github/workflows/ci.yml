name: CI
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain-action@stable
      - name: Build and test
        run: |
          cargo test --workspace --all-features
          cargo fmt -- --check || true
          cargo clippy --all-targets -- -D warnings || true
